#Sat Jul 18 00:02:03 UTC 2026
micronaut.application.name=platform
micronaut.server.port=${SERVER_PORT:8080}
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
micronaut.server.cors.configurations.web.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.info.enabled=true
micronaut.security.authentication=bearer
micronaut.security.token.jwt.signatures.secret.generator.secret=${JWT_GENERATOR_SIGNATURE_SECRET\:pleaseChangeThisSecretForANewOne}
couchdb.enabled=${COUCHDB_ENABLED:false}
couchdb.url=${COUCHDB_URL:http://localhost:5984}
couchdb.database=${COUCHDB_DATABASE:dnms_platform}
couchdb.username=${COUCHDB_USER:admin}
couchdb.password=${COUCHDB_PASSWORD:password}
