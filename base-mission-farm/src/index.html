<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Base Mission Farm</title>
    <base href="/base/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10261d" />
    <link
      rel="preload"
      as="image"
      href="assets/base/photos/drone-current-horizontal.jpg"
      fetchpriority="high"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      .initial-hero {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        object-fit: cover;
      }
      @media (max-width: 760px) {
        .initial-hero {
          object-position: 51% center;
        }
      }
    </style>
    <link rel="preload" as="image" href="assets/base/brand/logo-base-horizontal.svg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/base/fonts/lora-400.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="assets/base/fonts/sora-400.woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Base Mission Farm: formar, servir e enviar. Um ponto de partida para o avanço do Reino."
    />
  </head>
  <body>
    <base-root>
      <img
        class="initial-hero"
        src="assets/base/photos/drone-current-horizontal.jpg"
        alt=""
        fetchpriority="high"
      />
    </base-root>
    <noscript>
      <main class="static-projects">
        <h1>Base Mission Farm</h1>
        <h2>Corredor principal</h2>
        <div class="static-comparison">
          <figure>
            <img
              src="assets/base/project/before-corridor.jpeg"
              alt="Corredor atual da Base"
              width="1280"
              height="960"
            />
            <figcaption>Hoje</figcaption>
          </figure>
          <figure>
            <img
              src="assets/base/project/after-corridor.jpeg"
              alt="Projeto do corredor reformado"
              width="1402"
              height="1122"
            />
            <figcaption>A visão</figcaption>
          </figure>
        </div>
        <h2>Dormitório missionário</h2>
        <div class="static-comparison">
          <figure>
            <img
              src="assets/base/project/before-dormitory.jpeg"
              alt="Dormitório atual da Base"
              width="960"
              height="1280"
            />
            <figcaption>Hoje</figcaption>
          </figure>
          <figure>
            <img
              src="assets/base/project/after-dormitory.jpeg"
              alt="Projeto do dormitório para oito pessoas"
              width="1179"
              height="1334"
            />
            <figcaption>A visão</figcaption>
          </figure>
        </div>
      </main>
    </noscript>
  </body>
</html>
