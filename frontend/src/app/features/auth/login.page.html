<main class="page-shell login-page">
  <section class="surface auth-card">
    <a class="auth-logo-link" routerLink="/" aria-label="Voltar para a Home">
      <img class="auth-logo" src="assets/home/wordmark-orange.png" alt="dnms." width="498" height="165" />
    </a>

    <header class="auth-heading">
      <svg lucideLogIn aria-hidden="true"></svg>
      <div>
        <p>Área administrativa</p>
        <h1 id="login-title">Entrar</h1>
      </div>
    </header>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Email</span>
        <input formControlName="email" autocomplete="email" />
      </label>
      <label class="field">
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
      </label>
      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }
      <div class="auth-actions">
        <button class="dnms-button" type="submit">Entrar</button>
        <a class="dnms-button secondary" routerLink="/">Voltar para Home</a>
      </div>
    </form>
  </section>
</main>
