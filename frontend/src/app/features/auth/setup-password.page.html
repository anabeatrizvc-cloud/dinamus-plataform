<main class="page-shell login-page">
  <section class="surface login-card">
    <a routerLink="/">
      <img src="assets/home/wordmark-orange.png" alt="dnms." width="498" height="165" />
    </a>
    <div class="login-heading">
      <svg lucideKeyRound aria-hidden="true"></svg>
      <div>
        <p>Acesso de membro</p>
        <h1>Criar senha</h1>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Token do convite</span>
        <input formControlName="token" autocomplete="one-time-code" />
      </label>
      <label class="field">
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <button class="dnms-button" type="submit">Concluir acesso</button>
    </form>
  </section>
</main>
