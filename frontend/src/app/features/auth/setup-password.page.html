<main class="login-page">
  <section class="auth-card">
    <a class="auth-logo-link" routerLink="/" aria-label="Voltar para a Home">
      <img class="auth-logo" src="assets/home/wordmark-orange.png" alt="dnms." width="498" height="165" />
    </a>

    <div class="auth-heading">
      <span class="auth-icon">
        <svg lucideKeyRound aria-hidden="true"></svg>
      </span>
      <div>
        <p>Acesso de membro</p>
        <h1 id="setup-password-title">Criar senha</h1>
        <span>Defina sua senha para acessar os módulos liberados.</span>
      </div>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="setup-token">Token do convite</label>
        <span class="input-shell">
          <svg lucideTicket aria-hidden="true"></svg>
          <input id="setup-token" formControlName="token" autocomplete="one-time-code" />
        </span>
      </div>
      <div class="field">
        <label for="setup-password">Senha</label>
        <span class="input-shell">
          <svg lucideLockKeyhole aria-hidden="true"></svg>
          <input id="setup-password" type="password" formControlName="password" autocomplete="new-password" />
        </span>
      </div>
      <div class="auth-actions single">
        <button class="dnms-button" type="submit">Concluir acesso</button>
      </div>
    </form>
  </section>
</main>
