<main class="page-shell login-page">
  <section class="surface auth-card">
    <a class="auth-logo-link" routerLink="/" aria-label="Voltar para a Home">
      <img class="auth-logo" src="assets/home/wordmark-orange.png" alt="dnms." width="498" height="165" />
    </a>

    <div class="auth-heading">
      <svg lucideKeyRound aria-hidden="true"></svg>
      <div>
        <p>Acesso de membro</p>
        <h1 id="setup-password-title">Criar senha</h1>
      </div>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Token do convite</span>
        <input formControlName="token" autocomplete="one-time-code" />
      </label>
      <label class="field">
        <span>Senha</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>
      <div class="auth-actions single">
        <button class="dnms-button" type="submit">Concluir acesso</button>
      </div>
    </form>
  </section>
</main>
