<main class="page-shell eventos-page">
  <header class="eventos-hero">
    <span>
      <svg lucideTicket aria-hidden="true"></svg>
    </span>
    <div>
      <p>Próximos encontros</p>
      <h1>Eventos</h1>
    </div>
  </header>

  <section class="event-grid" aria-label="Eventos abertos">
    @for (event of events(); track event.id) {
      <article class="surface event-card">
        <div>
          <span>Evento</span>
          <h2>{{ event.name }}</h2>
        </div>
        <p>
          {{ formatDate(event.startsAt) }}
          @if (event.endsAt) {
            <span>até {{ formatDate(event.endsAt) }}</span>
          }
        </p>
        <a class="dnms-button" [href]="event.registrationUrl" target="_blank" rel="noopener">Inscrição</a>
      </article>
    } @empty {
      <article class="surface event-card">
        <div>
          <span>Evento</span>
          <h2>Em breve</h2>
        </div>
        <p>Novas inscrições serão abertas em breve.</p>
      </article>
    }
  </section>

  <dnms-bottom-nav [compact]="true" />
</main>
